      <g transform="rotate(5 547 646.0)" filter="url(#soft-cleanpedicure)">
        <rect x="477.0" y="474.0" width="140" height="172.0" rx="70.0" fill="#f6ead9" stroke="#dbc2a5" stroke-width="1" stroke-opacity="0.5"/>
      </g>
      <rect clip-path="url(#c-cleanpedicure-3)" x="494.0" y="508.0" width="17" height="76.0" rx="8.5" fill="#fffdfa" opacity="0.42"/>
