    </radialGradient>
    <filter id="soft-glassgloss" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#4b3a31" flood-opacity="0.22"/>
    </filter>
    <filter id="grain-glassgloss" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="c-glassgloss-0"><rect x="54.0" y="504.0" width="116" height="204.0" rx="58.0" transform="rotate(-18 112 708.0)"/></clipPath>
