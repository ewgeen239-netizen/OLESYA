    </filter>
    <filter id="grain-almondnude" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="c-almondnude-0"><rect x="54.0" y="490.0" width="116" height="218.0" rx="58.0" transform="rotate(18 112 708.0)"/></clipPath>
