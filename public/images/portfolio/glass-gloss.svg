      <clipPath id="c-glassgloss-3"><rect x="486.0" y="342.0" width="116" height="330.0" rx="58.0" transform="rotate(9 544 672.0)"/></clipPath>
      <clipPath id="c-glassgloss-4"><rect x="630.0" y="504.0" width="116" height="204.0" rx="58.0" transform="rotate(18 688 708.0)"/></clipPath>
  </defs>

  <rect width="800" height="1000" fill="url(#bg-glassgloss)"/>
  <rect width="800" height="1000" fill="url(#glow-glassgloss)"/>

