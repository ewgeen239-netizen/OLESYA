<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img">
  <defs>
    <linearGradient id="bg-almondnude" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ecdcc9"/>
      <stop offset="1" stop-color="#c4a181"/>
    </linearGradient>
    <radialGradient id="glow-almondnude" cx="0.32" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#fffdfa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fffdfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig-almondnude" cx="0.5" cy="0.45" r="0.92">
