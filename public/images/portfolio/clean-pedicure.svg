      <rect clip-path="url(#c-cleanpedicure-4)" x="641.0" y="610.0" width="17" height="4.0" rx="8.5" fill="#fffdfa" opacity="0.42"/>
      <ellipse clip-path="url(#c-cleanpedicure-4)" cx="694" cy="676.0" rx="72.8" ry="24" fill="#4b3a31" opacity="0.10"/>
